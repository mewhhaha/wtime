[workspace]
resolver = "3"
members = ["crates/*", "tools/wtime-conformance"]
default-members = ["crates/wtime-types", "crates/wtime-decode", "crates/wtime-validate", "crates/wtime-runtime", "crates/wtime-cli"]

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/mewhhaha/wtime"
homepage = "https://github.com/mewhhaha/wtime"
readme = "README.md"
keywords = ["webassembly", "wasm", "interpreter", "runtime"]
categories = ["wasm", "compilers"]

[workspace.dependencies]
wtime-types = { version = "0.1.13", path = "crates/wtime-types" }
wtime-decode = { version = "0.1.13", path = "crates/wtime-decode" }
wtime-validate = { version = "0.1.13", path = "crates/wtime-validate" }
wtime-runtime = { version = "0.1.13", path = "crates/wtime-runtime" }

[profile.dev]
debug = 1

[profile.test]
debug = 1
