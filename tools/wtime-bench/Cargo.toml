[package]
name = "wtime-bench"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Isolate the oracle and its lockfile from the production workspace.
[workspace]

[features]
default = []
# Compiles the same protocol against the archived original API.
legacy-api = []
# Shared protocol is also compiled by the tiny standalone profiler.
runtime-only = []
performance-counters = ["wtime-runtime/performance-counters"]


# Nondefault tiers are selected explicitly; placeholders remain unavailable.
execution-reference = ["wtime-runtime/execution-reference"]
compact-executor = ["wtime-runtime/compact-executor"]
register-executor = ["wtime-runtime/register-executor"]
experimental-executors = ["compact-executor", "register-executor"]
[dependencies]
wtime-runtime = { path = "../../crates/wtime-runtime" }
wtime-types = { path = "../../crates/wtime-types" }
wasmtime = { version = "=49.0.2", default-features = false, features = ["std", "runtime", "cranelift"] }
