<title id="title">wtime-aot speed-up: running the program</title>
<desc id="desc">competitor time ÷ wtime-aot time, median of paired rounds, log scale; right of parity is faster</desc>
<style>
.c { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
