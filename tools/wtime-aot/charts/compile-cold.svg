     font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
@media (prefers-color-scheme: dark) {
  .c { --surface:#161615; --border:#2b2b28; --ink:#f2f1ed; --ink2:#b8b6ad; --muted:#85837c; --grid:#292926; --axis:#3f3f3a;
