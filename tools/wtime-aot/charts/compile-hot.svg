<svg xmlns="http://www.w3.org/2000/svg" class="c" viewBox="0 0 780 394" width="780" height="394" role="img" aria-labelledby="title desc">
<title id="title">Hot compilation, incremental rebuild, &amp; warm load</title>
<desc id="desc">median wall time with warm caches (log scale, lower is better; AMD Ryzen 7 7800X3D, 16T)</desc>
<style>
.c { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
     --x64:#2a78d6; --c:#eb6834; --wt:#2b9348; --rust:#8b5cf6;
     font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
@media (prefers-color-scheme: dark) {
  .c { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
       --x64:#3987e5; --c:#d95926; --wt:#40b362; --rust:#a78bfa; }
}
.bg { fill:var(--surface); }
.t { fill:var(--ink); font-size:15px; font-weight:600; }
.st { fill:var(--ink2); font-size:12px; }
.lb { fill:var(--ink); font-size:12px; }
.grp { fill:var(--ink2); font-size:11px; font-weight:600; letter-spacing:.04em; }
.v { fill:var(--ink2); font-size:11px; font-variant-numeric:tabular-nums; }
.tick { fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
.grid { stroke:var(--grid); stroke-width:1; }
.ax { stroke:var(--axis); stroke-width:1.5; }
.x64 { fill:var(--x64); }
.bc { fill:var(--c); }
.wt { fill:var(--wt); }
.rust { fill:var(--rust); }
</style>
<rect class="bg" width="780" height="394" rx="8"/>
<text class="t" x="16" y="28">Hot compilation, incremental rebuild, &amp; warm load</text>
<text class="st" x="16" y="47">median wall time with warm caches (log scale, lower is better; AMD Ryzen 7 7800X3D, 16T)</text>
