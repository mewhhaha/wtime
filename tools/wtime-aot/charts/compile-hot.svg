<text class="lg" x="36" y="73.5">wtime-aot x64</text>
<rect class="bc" x="134" y="64" width="11" height="11" rx="3"/>
<text class="lg" x="150" y="73.5">wtime-aot c (-O2)</text>
<rect class="rust" x="274" y="64" width="11" height="11" rx="3"/>
<text class="lg" x="290" y="73.5">wtime-aot rust (-O3)</text>
<rect class="wt" x="434" y="64" width="11" height="11" rx="3"/>
<text class="lg" x="450" y="73.5">Wasmtime 49.0.3</text>
