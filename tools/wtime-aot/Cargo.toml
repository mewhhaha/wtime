[package]
name = "wtime-aot"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Compiles a WebAssembly module ahead of time to a safe Rust crate (wtime's validator, rustc's code generator)"

# Isolated from the production workspace, like the other tools.
[workspace]

[dependencies]
wtime-validate = { path = "../../crates/wtime-validate" }
wtime-types = { path = "../../crates/wtime-types" }

[dev-dependencies]
wtime-runtime = { path = "../../crates/wtime-runtime" }
