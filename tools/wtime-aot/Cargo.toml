[package]
name = "wtime-aot"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Ahead-of-time WebAssembly compiler with safe Rust, C99/Clang, and pure-Rust Linux x86-64/AArch64 backends"

# Isolated from the production workspace, like the other tools.
[workspace]

[dependencies]
wtime-validate = { path = "../../crates/wtime-validate" }
wtime-types = { path = "../../crates/wtime-types" }

[dev-dependencies]
wtime-runtime = { path = "../../crates/wtime-runtime" }
