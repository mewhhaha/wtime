[package]
name = "wtime-runtime"
description = "Safe-Rust, zero-dependency WebAssembly interpreter runtime with fuel, cancellation, and nonmoving GC"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
exclude = ["tests/fixtures/**/*.wat"]
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Development-only tracing; omitted from production builds.
opcode-coverage = []
# Bounded Store-local attribution only; excluded from production timings.
performance-counters = []

# Nondefault tiers are selected explicitly; placeholders remain unavailable.
execution-reference = []
compact-executor = []
register-executor = []
experimental-executors = ["compact-executor", "register-executor"]

[dependencies]
wtime-types.workspace = true
wtime-validate.workspace = true
