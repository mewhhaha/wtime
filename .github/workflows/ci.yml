name: Rust
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked --doc --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check rustdoc builds cleanly with -D warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --workspace --all-features
      - name: Verify crates.io package tarballs build cleanly and include licenses/READMEs
        run: |
          cargo package --locked --workspace --exclude wtime-conformance
          for crate in wtime-types wtime-decode wtime-validate wtime-runtime wtime-cli; do
            listing="$(cargo package --locked --list -p "$crate")"
            printf '%s\n' "$listing" | grep -qx 'LICENSE-MIT'
            printf '%s\n' "$listing" | grep -qx 'LICENSE-APACHE'
            printf '%s\n' "$listing" | grep -qx 'README.md'
          done
      - run: python3 -B tools/checks/dependency_budget.py
      - run: cargo build --locked -p wtime-cli -p wtime-conformance
      - run: python3 -B tools/checks/cli_smoke.py
      - run: python3 -B -m unittest discover -s tools/checks/tests -v
      - run: python3 -B tools/checks/hardening.py --native-report target/native-${{ runner.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.arch }}
          path: target/native-*.json
  wtime-aot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang and LLD for native AOT backend tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/wtime-aot/Cargo.toml -- --check
      - run: cargo fmt --manifest-path tools/wtime-aot/rt/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path tools/wtime-aot/rt/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path tools/wtime-aot/rt/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path tools/wtime-aot/Cargo.toml -- -D warnings
      - name: Run wtime-aot unit, oracle, ABI, fault-injection, and CLI tests
        env:
          WTIME_AOT_REQUIRE_NATIVE_TESTS: "1"
        run: cargo test --locked --manifest-path tools/wtime-aot/Cargo.toml
  wtime-goose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/wtime-goose/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path tools/wtime-goose/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path tools/wtime-goose/Cargo.toml
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - run: cargo test --locked -p wtime-conformance
      - run: bash tools/checks/ci.sh full
      - run: bash tools/checks/ci.sh allocation
      - run: python3 -B tools/checks/release_audit.py --verify-live-dir target/conformance
      - run: cargo build --locked -p wtime-conformance --bin wtime-probe
      - run: python3 -B tools/checks/opcode_coverage.py --require-complete
      - run: python3 -B tools/checks/release_audit.py --portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: target/conformance/*.json
  native-evidence:
    needs: core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: target/native
          merge-multiple: true
      - run: python3 -B tools/checks/hardening.py target/native/*.json
