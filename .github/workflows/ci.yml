name: Rust
on: [push, pull_request]
jobs:
  verification-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest discover -s tools/verification/tests -v
      - run: python3 -B tools/verify.py perf --output target/verification/ci-performance --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-performance
          path: target/verification/ci-performance
  core:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - run: cargo test --locked --workspace --all-features
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: python3 tools/checks/dependency_budget.py
      - name: Build the default CLI for the performance correctness smoke
        run: cargo build --locked --offline -j 1 -p wtime-cli
      - name: Bind and execute the performance correctness smoke
        run: |
          python3 -B tools/verification/producers/p111.py bind --binary target/debug/wtime-cli --output target/performance/P111/build.json
          python3 -B tools/checks/performance_ci.py --lane smoke --output target/performance/P111/smoke.json
          python3 -B tools/checks/performance_ci.py --lane reference --output target/performance/P111/reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-smoke-${{ runner.arch }}
          path: target/performance/P111/*.json
          retention-days: 14
      - run: python3 -m unittest discover -s tools/checks/tests -v
      - run: python3 tools/checks/hardening.py --native-report target/native-${{ runner.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.arch }}
          path: target/native-*.json
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - run: cargo test --locked -p wtime-conformance
      - run: bash tools/checks/ci.sh full
      - run: bash tools/checks/ci.sh allocation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: target/conformance/*.json
  native-evidence:
    needs: core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: target/native
          merge-multiple: true
      - run: python3 tools/checks/hardening.py target/native/*.json
