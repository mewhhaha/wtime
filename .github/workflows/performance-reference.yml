name: Performance reference
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: performance-reference
  cancel-in-progress: false
jobs:
  unavailable:
    if: vars.WTIME_REFERENCE_ENABLED != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tools/checks/performance_ci.py --lane reference --output target/performance/reference/unrun.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-reference-unrun
          path: target/performance/reference/unrun.json
          retention-days: 30
  reference:
    if: vars.WTIME_REFERENCE_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, wtime-reference]
    env:
      WTIME_REFERENCE_RUNNER: ${{ vars.WTIME_REFERENCE_RUNNER }}
      WTIME_REFERENCE_CONTRACT: ${{ vars.WTIME_REFERENCE_CONTRACT }}
      WTIME_REFERENCE_CONFIG: ${{ vars.WTIME_REFERENCE_CONFIG }}
      WTIME_REFERENCE_STATISTICS_ARTIFACT: ${{ vars.WTIME_REFERENCE_STATISTICS_ARTIFACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: Execute or revalidate the declared full contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WTIME_REFERENCE_RUNNER"
          test -n "$WTIME_REFERENCE_CONTRACT"
          test -n "$WTIME_REFERENCE_CONFIG"
          test -n "$WTIME_REFERENCE_STATISTICS_ARTIFACT"
          run_directory="target/performance/reference/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B tools/verify.py close --contract "$WTIME_REFERENCE_CONTRACT" --output "$run_directory/closure" --execute
          python3 -B tools/checks/performance_ci.py --lane reference --reference-config "$WTIME_REFERENCE_CONFIG" --statistics-artifact "$WTIME_REFERENCE_STATISTICS_ARTIFACT" --completion "$run_directory/closure/completion.json" --output "$run_directory/reference.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reference-${{ github.run_id }}
          path: target/performance/reference/${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
